<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>我的第一个静态网页</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, "Noto Sans", sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #1677ff;
      color: #fff;
      padding: 16px 24px;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    nav {
      margin-top: 8px;
    }
    nav a {
      color: #e6f4ff;
      margin-right: 16px;
      text-decoration: none;
      font-size: 14px;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px 40px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-radius: 6px;
    }
    section {
      padding: 24px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    section:last-child {
      border-bottom: none;
    }
    h2 {
      margin-top: 0;
      font-size: 20px;
      color: #1677ff;
    }
    p {
      line-height: 1.6;
      font-size: 14px;
    }
    .btn {
      display: inline-block;
      padding: 8px 16px;
      margin-top: 8px;
      background: #1677ff;
      color: #fff;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
    }
    .btn:hover {
      background: #165996;
    }
    footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <header>
    <h1>我的个人主页</h1>
    <nav>
      <a href="#about">关于我</a>
      <a href="#projects">项目</a>
      <a href="#contact">联系我</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>关于我</h2>
      <p>这里写一段你的自我介绍，比如你的兴趣、专业或工作方向。</p>
      <p>你可以根据需要增加段落或图片，让这个页面更符合你的需求。</p>
    </section>

    <section id="projects">
      <h2>我的项目</h2>
      <p>用列表的形式简单展示你做过的一些项目：</p>
      <ul>
        <li>项目 A：一句话介绍这个项目。</li>
        <li>项目 B：一句话介绍这个项目。</li>
        <li>项目 C：一句话介绍这个项目。</li>
      </ul>
      <a class="btn" href="#contact">想合作？点击联系我</a>
    </section>

    <section id="contact">
      <h2>联系我</h2>
      <p>你可以在这里放上邮箱、微信或其他联系方式。</p>
      <p>示例：邮箱：example@example.com</p>
    </section>
  </main>

  <footer>
    © 2025 我的静态网页示例
  </footer>
</body>
</html>
